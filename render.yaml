services:
  - type: web
    name: rota-ai-travel-planner
    runtime: python
    plan: free
    region: frankfurt
    autoDeployTrigger: checksPass
    buildCommand: pip install -r backend/requirements-lock.txt && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: NODE_VERSION
        value: 24.12.0
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: '[]'
      - key: VITE_API_BASE_URL
        value: /api
      - key: FREE_ONLY_MODE
        value: 'true'
      - key: ENABLE_GOOGLE_MAPS_GROUNDING
        value: 'false'
      - key: ENABLE_GOOGLE_SEARCH_GROUNDING
        value: 'false'
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FREE_TIER_CONFIRMED
        value: 'false'
      - key: DATABASE_URL
        value: sqlite:////tmp/rota/travel_planner.db
