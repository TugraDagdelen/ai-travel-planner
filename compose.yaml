services:
  app:
    build:
      context: .
    image: ai-travel-planner:local
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      CORS_ORIGINS: "[]"
      FREE_ONLY_MODE: "true"
      ENABLE_GOOGLE_MAPS_GROUNDING: "false"
      ENABLE_GOOGLE_SEARCH_GROUNDING: "false"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
      GEMINI_FREE_TIER_CONFIRMED: "${GEMINI_FREE_TIER_CONFIRMED:-false}"
      GEMINI_TIMEOUT_SECONDS: "60"
      PROVIDER_TIMEOUT_SECONDS: "45"
      DATABASE_URL: sqlite:////app/data/travel_planner.db
    volumes:
      - travel-data:/app/data
    restart: unless-stopped

volumes:
  travel-data:
